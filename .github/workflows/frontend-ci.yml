
name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'SitraLand_Frontend/**'
      - '.github/workflows/frontend-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Angular
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: SitraLand_Frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '14.21.3'
          cache: npm
          cache-dependency-path: SitraLand_Frontend/package-lock.json

      - name: Setup npm version
        run: npm install --global npm@7.24.2

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-timeout=300000

      - name: Build Angular production
        run: npm run build -- --configuration production

      - name: Verify frontend output
        run: test -f dist/SitraLand/index.html

      - name: Run Angular tests
        continue-on-error: true
        run: npm test -- --watch=false --browsers=ChromeHeadless
