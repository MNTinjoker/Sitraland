
name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'SitraLand_Api/**'
      - '.github/workflows/backend-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'SitraLand_Api/**'
      - '.github/workflows/backend-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Restore, Build and Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore SitraLand_Api/SitraLand_Api.sln

      - name: Build API
        run: dotnet build SitraLand_Api/SitraLand_Api.sln --configuration Release --no-restore

      - name: Publish API
        run: dotnet publish SitraLand_Api/SitraLand_Api.csproj --configuration Release --no-build --no-restore --output artifacts/backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v7
        with:
          name: sitraland-backend
          path: artifacts/backend/
          if-no-files-found: error
          retention-days: 14
