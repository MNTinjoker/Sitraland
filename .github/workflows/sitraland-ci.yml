
name: Sitraland CI

on:
  push:
    branches:
      - main
    paths:
      - 'SitraLand_Api/**'
      - 'SitraLand_Frontend/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, Test and Prepare Deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # Backend
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore Backend
        run: dotnet restore SitraLand_Api/SitraLand_Api.sln

      - name: Build Backend
        run: dotnet build SitraLand_Api/SitraLand_Api.sln --configuration Release --no-restore

      - name: Publish Backend
        run: dotnet publish SitraLand_Api/SitraLand_Api.csproj --configuration Release --no-build --no-restore --output artifacts/deploy

      # Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '14.21.3'
          cache: npm
          cache-dependency-path: SitraLand_Frontend/package-lock.json

      - name: Setup npm
        run: npm install --global npm@7.24.2

      - name: Install Frontend dependencies
        working-directory: SitraLand_Frontend
        run: npm ci --fetch-retries=5 --fetch-timeout=300000

      - name: Build Angular
        working-directory: SitraLand_Frontend
        run: npm run build -- --configuration production

      - name: Verify Angular output
        run: test -f SitraLand_Frontend/dist/SitraLand/index.html

      - name: Run Angular tests
        working-directory: SitraLand_Frontend
        continue-on-error: true
        run: npm test -- --watch=false --browsers=ChromeHeadless

      # Prepare deployment package
      - name: Assemble deployment directory
        run: |
          mkdir -p artifacts/deploy/ClientApp/dist
          mkdir -p artifacts/deploy/Files

          cp -a SitraLand_Frontend/dist/SitraLand/. artifacts/deploy/ClientApp/dist/

          touch artifacts/deploy/Files/.keep

          cat > artifacts/deploy/appsettings.json <<'EOF'
          {
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*"
          }
          EOF

     
      - name: Build production web.config
        env:
          PROD_SQL_CONNECTION: ${{ secrets.PROD_SQL_CONNECTION }}
          PROD_JWT_KEY: ${{ secrets.PROD_JWT_KEY }}
          PROD_JWT_LIFETIME: ${{ secrets.PROD_JWT_LIFETIME }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET

          path = Path("artifacts/deploy/web.config")

          required_secrets = {
              "PROD_SQL_CONNECTION": os.environ.get("PROD_SQL_CONNECTION"),
              "PROD_JWT_KEY": os.environ.get("PROD_JWT_KEY"),
              "PROD_JWT_LIFETIME": os.environ.get("PROD_JWT_LIFETIME"),
          }

          missing = [name for name, value in required_secrets.items() if not value]
          if missing:
              raise SystemExit("Missing required GitHub Secrets: " + ", ".join(missing))

          tree = ET.parse(path)
          root = tree.getroot()

          # Keep the ASP.NET Core configuration generated by dotnet publish.
          location = root.find("location")
          if location is None:
              raise SystemExit("Generated web.config has no location element")

          location_server = location.find("system.webServer")
          if location_server is None:
              raise SystemExit("Generated web.config has no system.webServer element")

          handlers = location_server.findall("./handlers/add")
          handlers = [h for h in handlers if h.get("name") == "aspNetCore"]

          if len(handlers) != 1:
              raise SystemExit("Expected exactly one ASP.NET Core handler")

          handlers[0].set("modules", "AspNetCoreModule")

          aspnet = location_server.find("aspNetCore")
          if aspnet is None:
              raise SystemExit("Generated ASP.NET Core process configuration is missing")

          # Add Production environment variables without printing their values.
          env_container = aspnet.find("environmentVariables")
          if env_container is None:
              env_container = ET.SubElement(aspnet, "environmentVariables")

          variables = {
              "ASPNETCORE_ENVIRONMENT": "Production",
              "ConnectionStrings__sqlConnection": required_secrets["PROD_SQL_CONNECTION"],
              "Jwt__Key": required_secrets["PROD_JWT_KEY"],
              "Jwt__lifetime": required_secrets["PROD_JWT_LIFETIME"],
          }

          for name, value in variables.items():
              for existing in list(env_container):
                  if existing.get("name") == name:
                      env_container.remove(existing)

              ET.SubElement(
                  env_container,
                  "environmentVariable",
                  {"name": name, "value": value}
              )

          # Preserve the existing Plesk HTTP error configuration.
          server = root.find("system.webServer")
          if server is None:
              server = ET.Element("system.webServer")
              root.insert(0, server)

          old_errors = server.find("httpErrors")
          if old_errors is not None:
              server.remove(old_errors)

          errors = ET.SubElement(server, "httpErrors")

          error_pages = [
              (400, "bad_request.html"),
              (401, "unauthorized.html"),
              (403, "forbidden.html"),
              (404, "not_found.html"),
              (405, "method_not_allowed.html"),
              (406, "not_acceptable.html"),
              (407, "proxy_authentication_required.html"),
              (412, "precondition_failed.html"),
              (414, "request-uri_too_long.html"),
              (415, "unsupported_media_type.html"),
              (500, "internal_server_error.html"),
              (501, "not_implemented.html"),
              (502, "bad_gateway.html"),
              (503, "maintenance.html"),
          ]

          for code, filename in error_pages:
              ET.SubElement(errors, "remove", {"statusCode": str(code)})
              ET.SubElement(
                  errors,
                  "error",
                  {
                      "statusCode": str(code),
                      "path": str(
                          Path(
                              r"C:\Inetpub\vhosts\sitraland.com\error_docs"
                          ) / filename
                      )
                  }
              )

          # Preserve Plesk tracing configuration.
          old_tracing = server.find("tracing")
          if old_tracing is not None:
              server.remove(old_tracing)

          tracing = ET.SubElement(server, "tracing")
          trace_requests = ET.SubElement(tracing, "traceFailedRequests")
          ET.SubElement(trace_requests, "clear")

          # Preserve Plesk compilation temporary directory.
          system_web = root.find("system.web")
          if system_web is None:
              system_web = ET.SubElement(root, "system.web")

          compilation = system_web.find("compilation")
          if compilation is None:
              compilation = ET.SubElement(system_web, "compilation")

          compilation.set(
              "tempDirectory",
              r"C:\Inetpub\vhosts\sitraland.com\tmp"
          )

          # Save and validate the final merged configuration.
          ET.indent(tree, space="  ")
          tree.write(path, encoding="utf-8", xml_declaration=True)

          final_root = ET.parse(path).getroot()
          final_location = final_root.find("location")
          final_server = final_location.find("system.webServer")
          final_handler = final_server.find("./handlers/add")
          final_aspnet = final_server.find("aspNetCore")
          final_env = final_aspnet.find("environmentVariables")

          if final_handler.get("modules") != "AspNetCoreModule":
              raise SystemExit("Incorrect ASP.NET Core module")

          names = {item.get("name") for item in final_env}
          if not set(variables).issubset(names):
              raise SystemExit("Production environment variables validation failed")

          if final_root.find("./system.webServer/httpErrors") is None:
              raise SystemExit("Plesk HTTP errors configuration missing")

          if final_root.find("./system.web/compilation") is None:
              raise SystemExit("Plesk compilation configuration missing")

          print("Merged production web.config successfully validated.")
          PY


      - name: Validate and create deployment ZIP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import xml.etree.ElementTree as ET

          root = Path("artifacts/deploy")
          output = Path("artifacts/Sitraland-deploy.zip")

          required = [
              "SitraLand_Api.dll",
              "web.config",
              "appsettings.json",
              "Files/.keep",
              "ClientApp/dist/index.html",
          ]

          for item in required:
              if not (root / item).is_file():
                  raise SystemExit(f"Missing deployment file: {item}")

          config = ET.parse(root / "web.config").getroot()
          handlers = [
              node for node in config.iter()
              if node.tag == "add" and node.get("name") == "aspNetCore"
          ]

          if len(handlers) != 1:
              raise SystemExit("Invalid ASP.NET Core handler configuration")

          if handlers[0].get("modules") != "AspNetCoreModule":
              raise SystemExit("Incorrect Plesk module configuration")

          if not list((root / "ClientApp/dist").glob("*.js")):
              raise SystemExit("Angular JavaScript bundles missing")

          if not list((root / "ClientApp/dist").glob("*.css")):
              raise SystemExit("Angular CSS bundles missing")

          output.parent.mkdir(parents=True, exist_ok=True)

          with ZipFile(output, "w", ZIP_DEFLATED) as archive:
              for file in root.rglob("*"):
                  if file.is_file():
                      archive.write(file, file.relative_to(root).as_posix())

          with ZipFile(output, "r") as archive:
              names = set(archive.namelist())
              for item in required:
                  if item not in names:
                      raise SystemExit(f"ZIP validation failed: {item}")

          print(f"Deployment package validated: {output}")
          print(f"Package size: {output.stat().st_size} bytes")
          PY


      
      - name: Create maintenance page
        run: |
          mkdir -p artifacts/maintenance

          cat > artifacts/maintenance/app_offline.htm <<'EOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>بروزرسانی سایت</title>
          </head>
          <body>
            <h2>سایت در حال بروزرسانی است</h2>
            <p>لطفاً چند دقیقه دیگر مجدداً مراجعه کنید.</p>
          </body>
          </html>
          EOF

      - name: Put production app offline
        id: put_app_offline
        env:
          FTP_SERVER: sitraland.com
          FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os

          with ftplib.FTP(timeout=30) as ftp:
              ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
              ftp.login(
                  os.environ["FTP_USERNAME"],
                  os.environ["FTP_PASSWORD"]
              )
              ftp.set_pasv(True)
              ftp.cwd("httpdocs")

              files = ftp.nlst()

              if any(
                  item.rstrip("/").split("/")[-1].lower() == "app_offline.htm"
                  for item in files
              ):
                  raise SystemExit(
                      "app_offline.htm already exists. Refusing to overwrite."
                  )

              with open(
                  "artifacts/maintenance/app_offline.htm", "rb"
              ) as page:
                  ftp.storbinary("STOR app_offline.htm", page)

          print("Production application is offline.")
          PY

      - name: Wait for application shutdown
        run: sleep 12

      - name: Deploy to Sitraland production
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: sitraland.com
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: artifacts/deploy/
          server-dir: httpdocs/
          dry-run: false
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            appsettings*.json
            **/appsettings*.json
            App_Data/**
            **/App_Data/**
            Files/**
            **/Files/**

      - name: Bring production app online
        if: success()
        env:
          FTP_SERVER: sitraland.com
          FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os

          with ftplib.FTP(timeout=30) as ftp:
              ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
              ftp.login(
                  os.environ["FTP_USERNAME"],
                  os.environ["FTP_PASSWORD"]
              )
              ftp.set_pasv(True)
              ftp.cwd("httpdocs")
              ftp.delete("app_offline.htm")

          print("Production application is online.")
          PY

      - name: Report deployment failure
        if: failure() && steps.put_app_offline.outcome == 'success'
        run: |
          echo "::error::Deployment failed after taking the application offline."
          echo "Keep the site offline until deployment is reviewed or backup is restored."
          echo "Remove httpdocs/app_offline.htm manually after recovery."

