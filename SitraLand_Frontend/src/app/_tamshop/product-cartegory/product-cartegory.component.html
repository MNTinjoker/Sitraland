<div class="appUserContainer shadow rounded">
  <div class="container">
    <div class="mt-3">
      <h5 class="title-vod mt-4 pt-2">{{title()}}</h5>
    </div>
    <div>
      <div class="text-center py-4" *ngIf="loadingProducts">
        <i class="fa fa-spin fa-spinner fa-2x"></i>
        <p class="mt-2 mb-0 text-muted">در حال بارگذاری محصولات...</p>
      </div>
      <div class="text-center py-4" *ngIf="!loadingProducts && productsError">
        <p class="mb-2">خطا در دریافت محصولات</p>
        <button class="btn btn-outline-danger btn-sm" (click)="retryLoadProducts()">تلاش مجدد</button>
      </div>
      <p-dataview #dv *ngIf="!productsError" [value]="productList" [paginator]="true" [lazy]="true" [totalRecords]="totalRecords" [rows]="16" [first]="firstRecord" [sortField]="sortField"
        [sortOrder]="sortOrder" [layout]="layoutGird" (onLazyLoad)="loadProducts($event)" emptyMessage="فعلا محصولی موجود نیست">
        <ng-template #header>
          <div class="d-lg-flex justify-content-between ">
            <!-- <span (click)="onSortChange()"  -->
            <!-- class=" col-lg-1  col-12 px-0 mb-2 search-box sort-text mb-2 mb-md-0"> -->
            <!-- <i *ngIf="sortBar" class="fa fa-sort-amount-asc sort-icon" aria-hidden="true"></i>
              <i *ngIf="!sortBar" class="fa fa-sort-amount-desc sort-icon" aria-hidden="true"></i>
              مرتب سازی: -->
            <!-- <p-select [options]="sortOptions" [(ngModel)]="sortKey" placeholder="مرتب‌سازی"
                (onChange)="onSortChange()" styleClass="mb-2 md:mb-0"></p-select>
            </span> -->
            <ul id='categoryHomeList' class="d-lg-flex px-0 mb-3 mt-1"
              [ngClass]="{'customCategoryHomeList': isCustomStyle}">
              <li *ngFor="let item of categoryHomeList" [attr.data-category-id]="item.categoryId" (click)="selectCategory(item.categoryId)">
                <p class="mb-0">{{item.categoryTitle}}</p>
              </li>
            </ul>
            <span class="search-box col-lg-4 col-12 px-0">
              <input pInputText type="text" placeholder='دنبال چه محصولی میگردی؟'
                [value]="searchTerm" (input)="onSearch($any($event.target).value)" class="input-search form-control">
              <img src="../../assets/images/search-normal.svg" width="30" class="searchImg" alt="">
            </span>
          </div>
        </ng-template>
        <ng-template #grid let-items>
          <ng-container *ngFor="let item of items">
            <article class="product-card col-lg-3 col-md-4 col-6 p-0" [class.product-card--empty]="item.count == 0"
              (click)="goToProductDetail(item.productId)">
              <div class="product-card-media" [class.is-empty]="item.count == 0">
                <img [src]="server + item.imageFolderPath" [alt]="item.productName" loading="lazy" decoding="async" appImageFallback>
                <span class="badge rounded-pill stock-badge" [class.bg-success]="item.count > 0"
                  [class.bg-danger]="item.count == 0">
                  <ng-container *ngIf="item.count > 0">{{item.count}} موجود</ng-container>
                  <ng-container *ngIf="item.count == 0">ناموجود</ng-container>
                </span>
                <span class="product-card-flag" *ngIf="item.isActive" title="فروش ویژه">
                  <i class="fa fa-percent"></i>
                </span>
              </div>
              <div class="product-card-body">
                <h3 class="product-card-name">{{item.productName}}</h3>
                <div class="product-card-footer">
                  <div class="product-card-price" [class.is-empty]="item.count == 0">
                    {{item.price | inputNumberSplit}}
                    <small>ریال</small>
                  </div>
                  <button class="product-card-add" type="button" [disabled]="item.count == 0"
                    [title]="item.count == 0 ? 'ناموجود' : 'افزودن به سبد خرید'"
                    (click)="addToCart(item.productId, $event)">
                    <i class="fa fa-cart-plus"></i>
                  </button>
                </div>
              </div>
            </article>
          </ng-container>
        </ng-template>
      </p-dataview>
    </div>
  </div>
</div>
