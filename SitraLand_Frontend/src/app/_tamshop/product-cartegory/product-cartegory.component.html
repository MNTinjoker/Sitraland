<div class="appUserContainer shadow rounded" [ngClass]="{'customAppUserContainer': isCustomStyle }"
  [ngStyle]="{ 'background-image': 'url(' + bgImage() + ')' }">
  <div class="container">
    <div class="mt-3">
      <h5 class="title-vod  mt-5 pt-4">{{title()}}</h5>
    </div>
    <div>
      <p-dataview #dv [value]="productList" [paginator]="true" [lazy]="true" [totalRecords]="totalRecords" [rows]="16" [first]="firstRecord" [sortField]="sortField"
        [sortOrder]="sortOrder" [layout]="layoutGird" (onLazyLoad)="loadProducts($event)" emptyMessage="فعلا محصولی موجود نیست">
        <ng-template #header>
          <div class="d-lg-flex justify-content-between ">
            <!-- <span (click)="onSortChange()"  -->
            <!-- class=" col-lg-1  col-12 px-0 mb-2 search-box sort-text mb-2 mb-md-0"> -->
            <!-- <i *ngIf="sortBar" class="fa fa-sort-amount-asc sort-icon" aria-hidden="true"></i>
              <i *ngIf="!sortBar" class="fa fa-sort-amount-desc sort-icon" aria-hidden="true"></i>
              مرتب سازی: -->
            <!-- <p-select [options]="sortOptions" [(ngModel)]="sortKey" placeholder="مرتب‌سازی"
                (onChange)="onSortChange()" styleClass="mb-2 md:mb-0"></p-select>
            </span> -->
            <ul id='categoryHomeList' class="d-lg-flex px-0 mb-3 mt-1"
              [ngClass]="{'customCategoryHomeList': isCustomStyle}">
              <li *ngFor="let item of categoryHomeList" [attr.data-category-id]="item.categoryId" (click)="selectCategory(item.categoryId)">
                <p class="mb-0">{{item.categoryTitle}}</p>
              </li>
            </ul>
            <span class="search-box col-lg-4 col-12 px-0">
              <input pInputText type="text" placeholder='دنبال چه محصولی میگردی؟'
                (input)="onSearch($event.target.value)" class="input-search form-control">
              <img src="../../assets/images/search-normal.svg" wdith="30" class="searchImg" alt="">
            </span>
          </div>
        </ng-template>
        <ng-template #grid let-items>
          <ng-container *ngFor="let item of items"><div [ngClass]="{'border-box-right': item.index%4==0}"
            (click)="goToProductDetail(item.productId)"
            class="col-lg-3 col-12 text-center p-3 border-box position-relative">
            <p *ngIf="item.count==0 " class="lock-text lock-text-slider lock-category-text">
              اتمام موجودی
            </p>
            <img [ngClass]="{'lock-product': item.count==0}" 
              class="img-owl-carousel-o" width="108" [src]="server + item.imageFolderPath" alt="">
            <img [ngClass]="{'lock-product': item.count==0}" *ngIf="item.isActive"
              src="../../../assets/images/special-sale.png" class="special-sale-img" alt="">
            <p [ngClass]="{'lock-product': item.count==0}" class="name-owl-carousel-o mt-3">
              {{item.productName}}</p>
            <div [ngClass]="{'lock-product': item.count==0}"
              class="product-btns justify-content-between align-items-end w-100">
              <!-- <div class="d-flex align-items-center"
                [ngClass]="{'justify-content-end': item.fldAmountCoin ==0 , 'justify-content-between' :item.fldAmountCoin !=0}">
                <div *ngIf="item.fldAmountCoin !=0" class="d-flex align-items-center flex-row-reverse pe-2">
                  <span class="coinTitle font-10">تام‌کوین</span> <span
                    class="ps-1 font-16 bold pe-1">{{item.fldAmountCoin}}</span>
                  <span class="coinTitle font-10 pe-2">تا سقف</span>
                  <img src="../../../assets/images/coin.png" class="discount-coin-img" width="24" alt="">
                </div> -->
              <!-- <img (click)="addToCart(item.fldPkDetailProduct)" src="../../../assets/images/buyIcon.png"
                  class="discount-coin-img" width="32" alt=""> -->
              <!-- </div> -->
              <div class="col-12 d-flex align-items-center justify-content-between">
                <span class="badge rounded-pill stock-badge"
                  [class.bg-success]="item.count > 0" [class.bg-danger]="item.count == 0">
                  <bdi *ngIf="item.count > 0">{{item.count}} موجود</bdi>
                  <bdi *ngIf="item.count == 0">ناموجود</bdi>
                </span>
                <div class="price">
                  <bdi> {{item.price | inputNumberSplit}} ریال</bdi>
                </div>
              </div>
              <div>
              </div>
            </div>
          </div></ng-container>
        </ng-template>
      </p-dataview>
    </div>
  </div>
</div>
