            <div class="col-lg-7 col-12">
              <h5 class="title-vod product-title mb-3">{{productDetail.productName}}</h5>
              <h6 class="title-vod mb-1">ویژگی‌ها:</h6>
              <p class="product-info border-bottom pb-2 mb-3" [innerHTML]="productDetail.productDescription"></p>
              <h6 *ngIf="productDetail.fldDescriptionSend" class="title-vod  mb-1">توضیحات :</h6>
              <p *ngIf="productDetail.extraDetails" class="product-info mb-3 border-bottom pb-2"
                [innerHTML]="productDetail.extraDetails"></p>
              <div class="d-flex pb-3 mt-3 justify-content-between">
                <p class="mb-0"> مبلغ </p>
                <div class="d-flex justify-content-center">
                  <p class="mb-0 h6 ml-1 tamCoin-number">{{productDetail.price | inputNumberSplit}}
                    <small>ریال</small>
                  </p>
                </div>
              </div>
            </div>
            <div class="col-12 text-center pt-4 border-top">
              <button (click)="addToCart()" class="btn btn-danger pointer" [disabled]="productDetail.count < 0 ">
                افزودن به سبد خرید
              </button>
            </div>
          </div>

        <div class="col-12">
          <app-product-carousel [categoryId]="categoryId"></app-product-carousel>
        </div>

<div id="modalGalleryBox" *ngIf='showGalleryBox' class="modalShadow">
  <div class="gallery-body text-center pt-0">
    <owl-carousel-o [options]="productCarouselOption" #owlPr>
      <ng-container *ngFor="let item of imageGallery">
        <ng-template carouselSlide [id]="item.url" class="ltr">
          <ng-container *ngIf=' item.url && item.url?.toLowerCase().endsWith("png") ||
                item.url?.toLowerCase().endsWith("jpg") || item.url?.toLowerCase().endsWith("jpeg") ||
                item.url?.toLowerCase().endsWith("gif")'>
            <img [src]="server +'shop/'+ item.url" class="img-fluid round-custom main-img" />
          </ng-container>
          <ng-container *ngIf='item.url && item.url?.toLowerCase().endsWith("mp4") ||
                item.url?.toLowerCase().endsWith("m4v") ||
                item.url?.toLowerCase().endsWith("m3u8")'>
            <div>
              <video controls class="video-player round-custom main-img">
                <source [src]="server + 'shop/'+  item.url + '#t=0.001' " [type]="'video/' + item.type" />
              </video>
            </div>
          </ng-container>
        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </div>
</div>
