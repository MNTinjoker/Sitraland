<div class="appUserContainer">
  <div class="container">
    <div>
      <div class="text-center" *ngIf="loader">
        <div class="preloader mx-auto">
          <!-- <i class="fa fa-spin fa-spinner fa-2x"></i> -->
        </div>
      </div>
      <div class="text-center py-5" *ngIf="!loader && notFound">
        <h5 class="title-vod mb-3">محصول پیدا نشد</h5>
        <a class="btn btn-outline-danger" routerLink="/home">بازگشت به صفحه اصلی</a>
      </div>
      <div class="row mt-3 mb-5" *ngIf="!loader && productDetail">
        <div class="col-12 mb-3">
          <div class="product-box row text-end">
            <div class="col-lg-5 col-12 ">
              <img *ngIf="mainImage" class="w-100 pointer" [src]="server + mainImage" alt="" appImageFallback
                (click)='open(mainImage)'>
              <div *ngIf="!mainImage" class="w-100 text-center border rounded p-5 text-gray">
                تصویری برای این محصول ثبت نشده است
              </div>

              <div class="simple-carousel-container mt-3" dir="ltr" *ngIf="galleryImages.length > 1">
                <owl-carousel-o [options]="productThumbCarouselOption">
                  <ng-container *ngFor="let image of galleryImages">
                    <ng-template carouselSlide [id]="image">
                      <img [src]="server + image" class="thumb pointer" appImageFallback
                        [ngClass]="{'product-gallery__carousel-item--active': mainImage === image}"
                        (click)="changeimage(image)" />
                    </ng-template>
                  </ng-container>
                </owl-carousel-o>
              </div>
            </div>
            <div class="col-lg-7 col-12">
              <h5 class="title-vod product-title mb-3">{{productDetail.productName}}</h5>
              <h6 class="title-vod mb-1">ویژگی‌ها:</h6>
              <p class="product-info border-bottom pb-2 mb-3" [innerHTML]="productDetail.productDescription"></p>
              <h6 *ngIf="productDetail.fldDescriptionSend" class="title-vod  mb-1">توضیحات :</h6>
              <p *ngIf="productDetail.extraDetails" class="product-info mb-3 border-bottom pb-2"
                [innerHTML]="productDetail.extraDetails"></p>
              <div class="d-flex pb-3 mt-3 justify-content-between">
                <p class="mb-0"> مبلغ </p>
                <div class="d-flex justify-content-center">
                  <p class="mb-0 h6 ms-1 tamCoin-number">{{productDetail.price | inputNumberSplit}}
                    <small>ریال</small>
                  </p>
                </div>
              </div>
            </div>
            <div class="col-12 text-center pt-4 border-top">
              <button (click)="addToCart()" class="btn btn-danger pointer" [disabled]="productDetail.count < 1">
                افزودن به سبد خرید
              </button>
            </div>
          </div>
        </div>
        <div class="col-12">
          <app-product-carousel [categoryId]="categoryId"></app-product-carousel>
        </div>
      </div>
    </div>
  </div>
</div>
