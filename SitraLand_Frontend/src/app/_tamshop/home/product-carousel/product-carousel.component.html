<div *ngIf="hasProduct" class="col-lg-12 container-carousel mt-5 shadow">
    <p *ngIf="statuseText==-1" class="title-text pt-3">تمامی محصولات<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==2" class="title-text pt-3">محصولات موتور<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==3" class="title-text pt-3"> محصولات گیربکس<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==4" class="title-text pt-3"> محصولات بدنه<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==5" class="title-text pt-3"> محصولات برقی<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==6" class="title-text pt-3"> سایر محصولات<title>سیترابند</title>
    </p>
    <p-carousel dir="ltr" id="allProduct" [value]="allItemList" [numVisible]="3" [numScroll]="1" [circular]="true"
        [responsiveOptions]="responsiveCarouselOptions">
        <ng-template let-product pTemplate="item">
            <div class="border-1 surface-border border-round m-2 text-center py-0 px-3 w-100 h-100">
                <div class="mb-3 border round p-2 itemofcarousel" (click)="goToProductDetail(product.productId)">
                    <p *ngIf="product.count==0 " class="lock-text lock-text-slider lock-category-text">
                        اتمام موجودی
                    </p>
                    <img class="simple-carousel-image w-6 img-fluid" [src]="server + product.imageFolderPath" />
                    <p [ngClass]="{'lock-product': product.count==0}" class="name-owl-carousel-o mt-3">
                        {{product.productName}}</p>
                    <div class="col-12 d-flex align-items-center justify-content-between">
                        <div class="price">
                            <p class="name-owl-carousel-o mt-3"> {{product.count }} موجود</p>
                        </div>
                        <div class="price">
                            <!-- <p class="name-owl-carousel-o mt-3"> {{product.price | inputNumberSplit}} ریال</p> -->
                        </div>
                    </div>
                </div>
            </div>
        </ng-template>
    </p-carousel>
</div>
