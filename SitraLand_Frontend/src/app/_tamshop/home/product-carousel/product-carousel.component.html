<div *ngIf="hasProduct()" class="col-lg-12 container-carousel mt-5 shadow">
    <p *ngIf="statuseText==-1" class="title-text pt-3">تمامی محصولات<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==2" class="title-text pt-3">محصولات موتور<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==3" class="title-text pt-3"> محصولات گیربکس<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==4" class="title-text pt-3"> محصولات بدنه<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==5" class="title-text pt-3"> محصولات برقی<title>سیترابند</title>
    </p>
    <p *ngIf="statuseText==6" class="title-text pt-3"> سایر محصولات<title>سیترابند</title>
    </p>
    <p-carousel dir="ltr" id="allProduct" [value]="allItemList" [numVisible]="3" [numScroll]="1" [circular]="true"
        [responsiveOptions]="responsiveCarouselOptions">
        <ng-template #item let-product>
            <article class="product-card" [class.product-card--empty]="product.count == 0"
                (click)="goToProductDetail(product.productId)">
                <div class="product-card-media" [class.is-empty]="product.count == 0">
                    <img [src]="server + product.imageFolderPath" [alt]="product.productName" loading="lazy" decoding="async">
                    <span class="badge rounded-pill stock-badge" [class.bg-success]="product.count > 0"
                        [class.bg-danger]="product.count == 0">
                        <ng-container *ngIf="product.count > 0">{{product.count}} موجود</ng-container>
                        <ng-container *ngIf="product.count == 0">ناموجود</ng-container>
                    </span>
                    <span class="product-card-flag" *ngIf="product.isActive" title="فروش ویژه">
                        <i class="fa fa-percent"></i>
                    </span>
                </div>
                <div class="product-card-body">
                    <h3 class="product-card-name">{{product.productName}}</h3>
                    <div class="product-card-footer">
                        <div class="product-card-price" [class.is-empty]="product.count == 0">
                            {{product.price | inputNumberSplit}}
                            <small>ریال</small>
                        </div>
                        <button class="product-card-add" type="button" [disabled]="product.count == 0"
                            [title]="product.count == 0 ? 'ناموجود' : 'افزودن به سبد خرید'"
                            (click)="addToCart(product.productId, $event)">
                            <i class="fa fa-cart-plus"></i>
                        </button>
                    </div>
                </div>
            </article>
        </ng-template>
    </p-carousel>
</div>
