<div class="appContainer bg-white">
  <div class="text-end">
    <div class="row mt-3 p-3 ">
      <div class="col-12 col-md-12">
        <div class="mb-3">
          <h4 class="text-dark text-center"> مدیریت کاربران </h4>
          <hr>
        </div>
      </div>
      <div *ngIf="editMode" class="container-fluid mt-2">
        <div class="row mt-3 p-3 ">
          <div class="mb-3 col-md-4">
            <label> نام کابری </label>
            <input type="text" name="firstname" class="form-control" [(ngModel)]='model.name' disabled="">
          </div>
          <div class="mb-3 col-md-4">
            <label>موبایل</label>
            <input type="text" class="form-control" [(ngModel)]='model.phoneNumber' OnlyNumber="true" disabled
              autocomplete="nope" maxlength="11">
          </div>
          <div class="mb-3 col-md-4">
            <label>دسترسی</label>
            <select class="form-control" [(ngModel)]='model.Role'>
              <option *ngFor='let role of roles' [value]='role.name'>{{role.normalizedName}}
              </option>
            </select>
          </div>

          <div class="col-12">
            <div class="mb-3">
              <button *ngIf='!submit' class="btn btn-danger" (click)="saveUser()">ذخیره</button>
              <button *ngIf='submit' class="btn btn-primary"><i class="fa fa-spin fa-spinner"></i></button>
              <button *ngIf='editMode' class="btn btn-danger me-2" (click)="clear()">لغو</button>
            </div>
          </div>
        </div>
      </div>
      <div class="container-fluid mt-2">
        <div class="row mt-3 bg-white p-3 ">
          <div class="col-12 d-flex mb-3">
            <button class="btn btn-danger" (click)="getUsers('admin')">لیست ادمین ها</button>
            <button class="btn btn-warning mx-2" (click)="getUsers('user')">لیست کابران </button>
          </div>
          <div class="col-md-12 col-12 col-lg-12">
            <div class="col-lg-4 col-md-6 col-sm-12 mx-auto" *ngIf="showPreLoader">
              <svg class="svgClassTest">
              </svg>
            </div>
            <p-table #dt id="myTable" [showGridlines]="true" [value]="users"
              [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
              currentPageReportTemplate="نمایش {first} تا {last} " [rowsPerPageOptions]="[10,25,50]"
              *ngIf="users && !showPreLoader">
              <ng-template #header>
                <tr>
                  <th>نام کابری</th>
                  <th> شماره همراه</th>
                  <th></th>
                </tr>
                <tr>
                  <th class="widthPrimeTh">
                    <input pInputText type="text" (input)="dt.filter($event.target.value, 'userName', 'contains')"
                      class="form-control">
                  </th>
                  <th class="widthPrimeTh">
                    <input pInputText type="text" (input)="dt.filter($event.target.value, 'phoneNumber', 'contains')"
                      class="form-control">
                  </th>
                  <th></th>
                </tr>
              </ng-template>
              <ng-template #body let-user>
                <tr>
                  <td class="px-2">
                    <div class="py-2 widthClassPrime">
                      <span>{{user.userName}}</span>
                    </div>
                  </td>
                  <td class="px-2">
                    <div class="py-2 widthClassPrime">
                      <span>{{user.phoneNumber}}</span>
                    </div>
                  </td>
                  <td class="px-2">
                    <div class="py-2 widthClassPrime">
                      <button class="btn btn-danger" (click)="selectedUser(user)" >انتخاب کاربر</button>
                    </div>
                  </td>
                </tr>
              </ng-template>
            </p-table>
          </div>
        </div>
        <hr>
      </div>
    </div>
  </div>
