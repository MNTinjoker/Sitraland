<div class="appContainer bg-white">
  <div class="text-end">
    <div class="container-fluid">
      <div class="mb-3 col-12 toolbar">
        <button (click)="goToConfg()" class="btn btn-primary">
          <i class="fa fa-plus"></i> محصول
        </button>
      </div>
      <div class="row">
        <div class="col-12">
          <p-table #dt [showGridlines]="false" [stripedRows]="true" [first]="lastLazyEvent.first" [rows]="10" [paginator]="true"
            [lazy]="true" [loading]="loading" [totalRecords]="totalRecords" (onLazyLoad)="loadProducts($event)"
            [value]="productList">
            <ng-template #header>
              <tr>
                <th class="min-width">#</th>
                <th class="min-width">تصویر</th>
                <th class="widthTable">
                  نام
                </th>
                <th class="widthTable" pSortableColumn='count' pResizableColumn>
                  تعداد <p-sortIcon field='count'>
                  </p-sortIcon>
                </th>
                <th  class="widthTable" pSortableColumn='price' pResizableColumn>
                  قیمت <p-sortIcon field='price'>
                  </p-sortIcon>
                </th>
                <th class="widthTable">
                  توضیحات
                </th>
                <th class="widthTable" pSortableColumn='isActive' pResizableColumn>
                  فعال<p-sortIcon field='isActive'>
                  </p-sortIcon>
                </th>
                <th class="min-width button-box"></th>
              </tr>
              <tr>
                <th class="min-width"></th>
                <th class="min-width"></th>
                <th class="widthPrimeTh">
                  <input pInputText type="text" (input)="onSearch($event.target.value)" class="form-control">
                </th>
                <th class="widthPrimeTh"></th>
                <th class="widthPrimeTh"></th>
                <th class="widthPrimeTh"></th>
                <th class="min-width"></th>
                <th class="button-box"></th>
              </tr>
            </ng-template>
            <ng-template #body let-product let-rowIndex="rowIndex">
              <tr>
                <td class="min-width">{{rowIndex + 1}}</td>
                <td class="min-width">
                  <img width="50" [src]="server + product.imageFolderPath" alt="">
                </td>
                <td class="min-width">
                  {{product.productName}}
                </td>
                <td class="min-width">
                  {{product.count}}
                </td>
                <td class="min-width">
                  {{product.price}}
                </td>
                <td class="min-width">
                  {{product.productDescription}}
                </td>
                <td class="min-width">
                  {{product.fldIsActiveTitle}}
                </td>
                <td class="min-width button-box">
                  <button class="btn btn-outline-primary mx-05" (click)='goToProductConfig(product.productId)'>
                    ویرایش
                  </button>
                  <button class="btn btn-outline-danger mx-05" (click)='deleteProduct(product.productId)'>
                    حذف
                  </button>
                </td>
              </tr>
            </ng-template>
            <ng-template #empty>
              <tr>
                <td [attr.colspan]="8" class="text-center p-5">
                  <div class="p-table-empty">
                    <i class="fa fa-box-open"></i>
                    <p>هیچ محصولی در این لیست یافت نشد</p>
                    <button (click)="goToConfg()" class="btn btn-primary mt-2">
                      <i class="fa fa-plus"></i> افزودن محصول جدید
                    </button>
                  </div>
                </td>
              </tr>
            </ng-template>
          </p-table>

        </div>
      </div>
    </div>
  </div>
</div>
