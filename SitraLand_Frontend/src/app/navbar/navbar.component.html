<div *ngIf="!notSeeMenu()">
  <header>
    <div class="navContainer" id="nav">
      <div class="nav-inner">
        <a class="nav-brand" routerLink="/home" aria-label="سیترالند">
          <img class="nav-logo" src="../../assets/images/navbar-logo.webp" alt="سیترالند">
        </a>

        <div class="navbar-search">
          <input #searchInput type="search" class="form-control" placeholder="دنبال چه محصولی میگردی؟"
            (keyup.enter)="search(searchInput.value)" aria-label="جستجوی محصول">
          <button class="btn btn-primary" type="button" (click)="search(searchInput.value)" aria-label="جستجو">
            <i class="fa fa-search"></i>
          </button>
        </div>

        <div class="nav-actions">
          <a *ngIf="userName == 'مهمان'" class="nav-action" routerLink="/login">
            <img src="../../assets/images/login.svg" class="nav-icon" alt="">
            <span class="nav-action-text">ورود</span>
          </a>
          <a *ngIf="userName != 'مهمان'" class="nav-action" (click)="logOut()">
            <img src="../../assets/images/logout.svg" class="nav-icon" alt="">
            <span class="nav-action-text">خروج</span>
          </a>
          <a *ngIf="isAdmin" class="nav-action" (click)="goToAdminPage()">
            <img src="../../assets/images/admin.svg" class="nav-icon" alt="">
            <span class="nav-action-text">مدیریت</span>
          </a>
          <a class="nav-action nav-basket" routerLink="/basket" (click)="handleClick()">
            <img src="../../assets/images/basket.svg" class="nav-icon" alt="">
            <span class="nav-action-text">سبد</span>
            <span class="nav-count" *ngIf="cartCount > 0">{{cartCount}}</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- The tab bar of the phone: home, products, basket, account -->
  <nav class="bottom-tabs" aria-label="ناوبری موبایل">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="handleClick()">
      <i class="fa fa-home"></i>
      <span>خانه</span>
    </a>
    <a routerLink="/product-cartegory" routerLinkActive="active" (click)="handleClick()">
      <i class="fa fa-shopping-bag"></i>
      <span>محصولات</span>
    </a>
    <a routerLink="/basket" routerLinkActive="active" (click)="handleClick()">
      <i class="fa fa-shopping-cart"></i>
      <span>سبد</span>
      <span class="nav-count" *ngIf="cartCount > 0">{{cartCount}}</span>
    </a>
    <a *ngIf="userName == 'مهمان'" routerLink="/login" routerLinkActive="active" (click)="handleClick()">
      <i class="fa fa-user"></i>
      <span>حساب</span>
    </a>
    <a *ngIf="userName != 'مهمان'" (click)="logOut()">
      <i class="fa fa-sign-out"></i>
      <span>خروج</span>
    </a>
  </nav>

  <!-- The toolbar of the admin panel -->
  <div class="admin-toolbar" *ngIf='showAdminSiderBar'>
    <button class="btn btn-sm btn-danger" (click)="showAdminSiderBar = false" routerLink="/home">صفحه اصلی</button>
    <button *ngFor='let menu of sidebarList' class="btn btn-sm btn-secondary" (click)="closeAfterClick()"
      [routerLink]="menu.link">{{menu.text}}</button>
  </div>
</div>
