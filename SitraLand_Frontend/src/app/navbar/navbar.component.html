<div *ngIf="!notSeeMenu()">
  <header>
    <div class="bg-white align-items-center d-flex justify-content-between overflow-auto px-1 navContainer" id="nav">
      <div (click)="hamburgerClick2()" class="hamburger d-none mr-3" id="hamburger-1" style="z-index: 4">
        <span class="line-hamurger"></span>
        <span class="line-hamurger my-1"></span>
        <span class="line-hamurger"></span>
      </div>
      <div id="logoInNavbar" class="col-lg-4 text-right pr-0">
        <a>
          <img class="logo-navbar" src="../../assets/images/navbar-logo.png" class="mr-2 logoS" alt="SitraLand">
        </a>
      </div>
      <div class="d-flex align-items-center">

        <!-- <a class="mr-0 ml-1 d-flex align-items-center pointer goftino" (click)="goftino()">
          <i class="fal fa-question-circle text-secondary question"></i>
        </a> -->
        <div class="mx-2">
          <a *ngIf="userName =='مهمان' " class="position-relative pointer "  routerLink="/login">
            ورود
            <img src="../../assets/images/login.svg" class="admin" alt="login">
          </a>
          <a *ngIf="userName !='مهمان' " class="position-relative pointer " (click)="logOut()">
            خروج
            <img src="../../assets/images/logout.svg" class="admin" alt="login" >
          </a>
        </div>

        <div>
          <a *ngIf="isAdmin" class="position-relative pointer " (click)="goToAdminPage()">
            <img src="../../assets/images/admin.svg" class="admin" alt="admin">
          </a>
        </div>


        <div class="border-secondary ml-lg-1">
          <div class="position-relative mr-3">
            <a class="mr-0 ml-1 d-flex align-items-center text-secondary basket-num" (click)="handleClick()"
              routerLink="/basket">
              <!-- class="iconbox" -->
              <div>
                <img src="../../assets/images/basket.svg" class="admin" alt="Buy">
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>
  <div *ngIf='!showAdminSiderBar' [ngClass]='!showNav ? "hideSidebar"  : ""' class=" sidebar flex-column overflow-auto"
    id="sidebar">
    <div>
      <div class="pointer mt-3">
        <img src="../../assets/images/avatarForNavbar.svg" class="profileImage ml-1 mr-2" width="80px" alt="">
        <h6 class="my-3">{{userName}}</h6>
      </div>
      <hr>
      <div class="flex-fill pt-2">
        <a routerLink="/home" routerLinkActive='active' (click)="handleClick()">
          <div class="sidebarBack">
            <img class="sidebar-icon" src="../../assets/images/dashBoardIcon.svg" alt="">
            <div class="font-weight-bold icon-text">صفحه اصلی</div>
          </div>
        </a>
      </div>

      <!-- <div *ngIf="isAdmin" class="flex-fill pt-2">
        <a routerLink="/admin/home" routerLinkActive='active' (click)="handleClick()">
          <div class="sidebarBack">
            <img class="sidebar-icon" src="../../assets/images/dashBoardIcon.svg" alt="">
            <div class="font-weight-bold icon-text">صفحه اصلی</div>
          </div>
        </a>
      </div> -->

      <div class="flex-fill">
        <a routerLink="/product-cartegory" routerLinkActive='active' (click)="handleClick()">
          <div class="sidebarBack">
            <img class="sidebar-icon" src="../../assets/images/shopSidebar.svg" alt="">
            <div class="icon-text"> محصولات</div>
          </div>
        </a>
      </div>

      <!-- <div class="pt-2">
        <a routerLink="/orders-list" routerLinkActive='active' (click)="handleClick()">
          <div class="sidebarBack">
            <img class="sidebar-icon" src="../../assets/images/bag-tamshop-menu.svg">
            <div class="font-weight-bold icon-text"> سفارشات</div>
          </div>
        </a>
      </div> -->
    </div>
  </div>


  <div [ngClass]='!showNav ? "hideSidebar"  : ""' class="sidebarAdmin flex-column overflow-auto px-3" id="sidebar-admin"
    *ngIf='showAdminSiderBar'>
    <button class="btn btn-sm mb-2 w-100 btn-danger" (click)="showAdminSiderBar = false" routerLink="/home">صفحه
      اصلی</button>
    <button *ngFor='let menu of sidebarList' class="btn btn-sm mb-2 w-100
      btn-secondary" (click)="closeAfterClick()" [routerLink]="menu.link">{{menu.text}}</button>
  </div>
</div>
