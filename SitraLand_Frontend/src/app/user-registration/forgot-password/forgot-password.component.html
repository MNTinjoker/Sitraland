<div class="login-container">
  <div class="col-lg-3 col-12 form-login px-2">
    <h6 class="text-light mb-4">Email Confirmation</h6>
    <div class="timer-box">
      <cd-timer [ngClass]="{'black-element': sendEmail}" id="timerforEmail" format="user" [countdown]="true"
        (onStop)="stopTimer()" [startTime]="time">
        [minutes]:[seconds]
      </cd-timer>
    </div>
    <div class="w-100">
      <input type="text" placeholder="WE send the code to your email" class="input-forgot-pass">
    </div>
    <button class="btn btn-login w-100 mt-4" (click)="confirm()"> Confirm </button>
    <p class="text-light text-right mt-1 pointer" routerLink="/">login</p>

  </div>
</div>
