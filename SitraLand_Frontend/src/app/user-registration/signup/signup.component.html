<div class="col-12">
  <form class="login col-lg-4 col-12" #myForm='ngForm' (ngSubmit)='singUp(myForm)'>
    <img class="logo" src="../../../assets/images/logo.webp" class="logo" alt="SitraLand">
    <h6 class="my-4">ثبت نام</h6>
    <input #fullName='ngModel' type="text" placeholder="نام‌کاربری" id="fullName" name="fullName"
      [(ngModel)]="userDetail.fullName" class="input-login user-input"
      [ngClass]="{'shaking-border': fullName.invalid && fullName.touched}" required>
    <div class="w-100 mt-4">
      <input #mobile='ngModel' type="text" placeholder=" شماره همراه" id="mobile" name="mobile"
        [(ngModel)]="userDetail.mobile" class="input-login lock-input"
        [ngClass]="{'shaking-border': mobile.invalid && mobile.touched}" required>
    </div>
    <div class="w-100 mt-4">
      <input #password='ngModel' type="password" placeholder="رمز عبور" id="password" name="password"
        [(ngModel)]="userDetail.password" class="input-login lock-input"
        [ngClass]="{'shaking-border': password.invalid && password.touched}" required>
    </div>
    <button class="btn btn-danger w-100 mt-3" type="submit">ثبت‌نام</button>
    <div class="mt-4 text-end">
      <!-- <h6 href="#">Forgot password</h6> -->
      <h6 class="text-secondary pointer" routerLink="/login">ورود</h6>
    </div>
  </form>
</div>
